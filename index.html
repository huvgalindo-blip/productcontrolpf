<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Pizzafresh - Control Producción</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
</head>
<body>
    <div id="app">
        <!-- ============================================= -->
        <!-- NAVEGACIÓN                                     -->
        <!-- ============================================= -->
        <nav id="navbar">
            <div class="nav-brand">
                <span class="logo">🍕</span>
                <span class="brand-name">Quality Pizzafresh</span>
            </div>
            <div class="nav-links">
                <button class="nav-btn active" data-vista="produccion">📋 Producción</button>
                <button class="nav-btn" data-vista="dashboard">📊 Dashboard</button>
                <button class="nav-btn" data-vista="amasado">🔄 Amasado</button>
                <button class="nav-btn" data-vista="clientes">👥 Clientes</button>
                <button class="nav-btn" data-vista="productos">📦 Productos</button>
                <button class="nav-btn" data-vista="configuracion">⚙️ Config</button>
            </div>
            <div class="nav-hamburger" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </div>
        </nav>

        <!-- ============================================= -->
        <!-- CONTENIDO PRINCIPAL                            -->
        <!-- ============================================= -->
        <main id="main-content">
            <div id="vista-container"></div>
        </main>

        <!-- ============================================= -->
        <!-- NOTIFICACIONES                                 -->
        <!-- ============================================= -->
        <div id="notification" class="notification hidden"></div>
    </div>

    <!-- ============================================= -->
    <!-- SCRIPTS - MÓDULOS EN ORDEN DE DEPENDENCIA      -->
    <!-- ============================================= -->
    <script src="js/datos.js"></script>
    <script src="js/utilidades.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/clientes.js"></script>
    <script src="js/produccion.js"></script>
    <script src="js/amasado.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/configuracion.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
